<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | WebStore Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
         [data-bs-theme="dark"] body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.6s ease-out;
        }
        .form-control {
            padding: 12px 20px;
            border-radius: 12px;
            background-color: var(--bg-color);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-5">
            <a href="index.html" class="navbar-brand justify-content-center mb-4">
                <i class="bi bi-grid-fill"></i> WebStore Hub
            </a>
            <h3 class="fw-bold">Create an Account</h3>
            <p class="text-secondary">Start exploring the best tools today</p>
        </div>

        <form action="dashboard.html">
            <div class="mb-4">
                <label class="form-label fw-medium">Full Name</label>
                <input type="text" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium">Email Address</label>
                <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-4 small text-secondary">
                By clicking "Get Started", you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">Get Started</button>
        </form>

        <div class="text-center mt-5">
            <p class="text-secondary small">Already have an account? <a href="login.html" class="text-primary fw-bold">Log in</a></p>
        </div>
    </div>

    <!-- Theme Toggle Fixed -->
    <button class="btn btn-link position-fixed bottom-0 end-0 m-4 text-secondary" id="themeToggle">
        <i class="bi bi-moon-stars-fill fs-4"></i>
    </button>

    <script src="assets/js/main.js"></script>
</body>
</html>
