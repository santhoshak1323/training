<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | WebStore Hub</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-grid-fill"></i> WebStore Hub</a>
        </div>
    </nav>

    <!-- Search Top -->
    <section class="py-5 bg-light-subtle">
        <div class="container">
            <div class="search-container mx-auto">
                <input type="text" class="search-input" value="AI tools" placeholder="Search here...">
                <i class="bi bi-search search-icon"></i>
            </div>
            <p class="text-center mt-3 text-secondary">Found 3 results for "AI tools"</p>
        </div>
    </section>

    <!-- Results Grid -->
    <main class="container py-5">
        <div class="row g-4">
            <!-- ChatGPT -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="website-card w-100" onclick="location.href='website-details.html'">
                    <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?w=500" class="card-img-top w-100" alt="ChatGPT">
                    <div class="card-body">
                        <div class="card-category">AI Tool</div>
                        <h5 class="card-title">ChatGPT</h5>
                        <p class="card-description">Advanced AI language model for conversation.</p>
                        <button class="btn btn-outline-primary w-100">Visit Website</button>
                    </div>
                </div>
            </div>
             <!-- Midjourney -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="website-card w-100" onclick="location.href='website-details.html'">
                    <img src="https://images.unsplash.com/photo-1664575602276-acd073f104c1?w=500" class="card-img-top w-100" alt="Midjourney">
                    <div class="card-body">
                        <div class="card-category">AI Tool</div>
                        <h5 class="card-title">Midjourney</h5>
                        <p class="card-description">Create realistic AI art and illustrations.</p>
                        <button class="btn btn-outline-primary w-100">Visit Website</button>
                    </div>
                </div>
            </div>
             <!-- Runway -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="website-card w-100" onclick="location.href='website-details.html'">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" class="card-img-top w-100" alt="Runway">
                    <div class="card-body">
                        <div class="card-category">AI Tool</div>
                        <h5 class="card-title">Runway</h5>
                        <p class="card-description">AI-powered video editing and creation tool.</p>
                        <button class="btn btn-outline-primary w-100">Visit Website</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 border-top">
        <p>© 2026 WebStore Hub</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
